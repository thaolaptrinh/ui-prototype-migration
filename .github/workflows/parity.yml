name: parity

# Two jobs:
#
# 1. self-test (runs on every push/PR): serves one fixture on two ports and
#    verifies it against itself. The gate MUST report PARITY OK — this is the
#    regression test for the verifier itself.
#
# 2. parity (manual): runs the unified visual-fidelity gate
#    (scripts/verify-parity.mjs) for a prototype ↔ migrated-target pair.
#    Set PROTOTYPE_URL/TARGET_URL to your running previews, or wire this into
#    a job that builds the target first (see commented steps).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      prototype_url:
        description: "Prototype URL (source of truth)"
        required: true
        default: "http://127.0.0.1:5187"
      target_url:
        description: "Migrated target URL"
        required: true
        default: "http://127.0.0.1:5190"
      selectors:
        description: "Selector JSON path (repo-relative)"
        required: true
        default: "examples/fixtures/prototype-landing/selectors.example.json"
      theme_key:
        description: "localStorage key for theme (empty = single theme)"
        required: false
        default: "pulse-theme"

jobs:
  # ---- regression test for the verifier itself -------------------------------
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Serve fixture on two ports
        run: |
          python3 -m http.server 5187 --directory examples/fixtures/prototype-landing &
          python3 -m http.server 5190 --directory examples/fixtures/prototype-landing &
        shell: bash

      - name: Wait for servers
        run: |
          for port in 5187 5190; do
            curl --retry 10 --retry-delay 1 --retry-connrefused -s -o /dev/null "http://127.0.0.1:${port}/" \
              || { echo "server on :${port} never became ready"; exit 1; }
          done

      - name: Verify parity (fixture vs itself — must be PARITY OK)
        run: |
          node scripts/verify-parity.mjs \
            --prototype http://127.0.0.1:5187 --target http://127.0.0.1:5190 \
            --selectors examples/fixtures/prototype-landing/selectors.example.json \
            --themes light,dark --viewports 1440,1024,768 --theme-key pulse-theme \
            --axe --out ./compare-report

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-test-report
          path: compare-report

  # ---- manual gate against your own app ---------------------------------------
  parity:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      PROTOTYPE_URL: ${{ inputs.prototype_url }}
      TARGET_URL: ${{ inputs.target_url }}
      SELECTORS: ${{ inputs.selectors }}
      THEME_KEY: ${{ inputs.theme_key }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Serve prototype (static fixture)
        run: python3 -m http.server 5187 --directory examples/fixtures/prototype-landing &
        shell: bash

      # The target app lives in your own repo, not here. Build-and-serve it in
      # a job/step of your own (see the commented example below), then hand its
      # URL to `inputs.target_url`. If it is built in this repo, uncomment and
      # adapt:
      # - name: Build target
      #   run: cd <your-target-dir> && npm ci && npm run build
      # - name: Serve target
      #   run: python3 -m http.server 5190 --directory <your-target-dir>/dist &
      #   shell: bash

      - name: Wait for server
        run: |
          curl --retry 10 --retry-delay 1 --retry-connrefused -s -o /dev/null "${PROTOTYPE_URL}/" \
            || { echo "prototype server never became ready"; exit 1; }

      - name: Verify parity
        run: |
          node scripts/verify-parity.mjs \
            --prototype "${PROTOTYPE_URL}" \
            --target "${TARGET_URL}" \
            --selectors "${SELECTORS}" \
            --themes light,dark --viewports 1440,1024,768 \
            $([ -n "${THEME_KEY}" ] && echo "--theme-key ${THEME_KEY}") \
            --axe --out ./compare-report

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compare-report
          path: compare-report
